<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Daubert sign-in code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #111111;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f5; padding: 40px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0; max-width: 560px; width: 100%;">

          <!-- Brand accent stripe -->
          <tr>
            <td style="height: 4px; background-color: #1F2A4A; font-size: 0; line-height: 0;">&nbsp;</td>
          </tr>

          <!-- Header -->
          <tr>
            <td style="padding: 28px 40px 24px 40px; border-bottom: 1px solid #e8e8e8;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align: middle; padding-right: 12px;">
                    <img src="{{logoUrl}}" alt="Daubert AI" width="36" height="36" style="display: block; border: 0; outline: none; text-decoration: none;" />
                  </td>
                  <td style="vertical-align: middle;">
                    <p style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: #111111;">Daubert AI</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 36px 40px 28px 40px;">
              <p style="margin: 0 0 8px 0; font-size: 15px; color: #444444; line-height: 1.5;">Use the code below to sign in to your account.</p>
              <p style="margin: 0 0 28px 0; font-size: 13px; color: #888888; line-height: 1.5;">This code expires in 5 minutes. Do not share it with anyone.</p>

              <!-- OTP code block -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="padding: 24px 0 28px 0;">
                    <div style="display: inline-block; background-color: #f7f8fb; border: 1px solid #dfe3ee; border-radius: 8px; padding: 22px 36px;">
                      <span style="font-family: 'SF Mono', 'Menlo', 'Courier New', Courier, monospace; font-size: 38px; font-weight: 700; letter-spacing: 0.45em; color: #1F2A4A; padding-right: 0;">{{code}}</span>
                    </div>
                  </td>
                </tr>
              </table>

              <p style="margin: 8px 0 0 0; font-size: 13px; color: #888888; line-height: 1.5;">If you did not request this code, you can safely ignore this email.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 40px 28px 40px; border-top: 1px solid #e8e8e8;">
              <p style="margin: 0; font-size: 12px; color: #aaaaaa; line-height: 1.5;">&copy; {{year}} Daubert AI. All rights reserved.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
