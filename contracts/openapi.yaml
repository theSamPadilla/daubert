openapi: 3.0.3
info:
  title: Daubert API
  version: 0.1.0
  description: Blockchain investigation tool API

servers:
  - url: http://localhost:8081

paths:
  /auth/me:
    get:
      summary: Get the current authenticated user
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: './schemas/common.yaml#/UserSelf'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './schemas/common.yaml#/ErrorResponse'
  /cases:
    $ref: './paths/cases.yaml#/~1cases'
  /cases/{id}:
