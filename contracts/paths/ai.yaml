/cases/{caseId}/conversations:
  post:
    summary: Create a new conversation for a case
    operationId: createConversation
    tags: [AI]
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '201':
        description: Conversation created
        content:
          application/json:
            schema:
              $ref: '../schemas/ai.yaml#/Conversation'
  get:
    summary: List conversations for a case
    operationId: listConversations
    tags: [AI]
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: List of conversations
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/ai.yaml#/Conversation'

/conversations/{id}:
  delete:
    summary: Delete a conversation and its messages
    operationId: deleteConversation
    tags: [AI]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Deleted

/conversations/{id}/messages:
  get:
    summary: Get message history for a conversation
    operationId: getConversationMessages
    tags: [AI]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Message list
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/ai.yaml#/Message'

/conversations/{id}/chat:
  post:
    deprecated: true
    summary: 'Legacy: start a run and relay its events on this response'
    operationId: chatStream
    tags: [AI]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/ai.yaml#/ChatRequest'
    responses:
      '200':
        description: SSE stream of chat events (text/event-stream)
        content:
          text/event-stream:
            schema:
              $ref: '../schemas/ai.yaml#/ChatSseEvent'

/conversations/{id}/runs:
  post:
    summary: Start an agent run for a new user message
    description: Returns immediately. Follow progress via /conversations/{id}/runs/{runId}/events.
    operationId: startAgentRun
    tags: [AI]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/ai.yaml#/ChatRequest'
    responses:
      '202':
        description: Run queued
        content:
          application/json:
            schema:
              $ref: '../schemas/ai.yaml#/AgentRunStarted'
      '409':
        description: A run is already active in this conversation (body includes activeRunId)

/conversations/{id}/runs/latest:
  get:
    summary: The conversation's most recent run, or null
    operationId: getLatestAgentRun
    tags: [AI]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Latest run
        content:
          application/json:
            schema:
              $ref: '../schemas/ai.yaml#/LatestAgentRun'

/conversations/{id}/runs/{runId}/events:
  get:
    summary: Resumable SSE stream of a run's events
    description: >-
      Each event carries `id: <seq>`. The stream ends at the `done` event, or
      after a few minutes without it, in which case reconnect with
      `after=<last id>`. `done` data is `{ conversationId, status }`.
    operationId: streamAgentRunEvents
    tags: [AI]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
    responses:
      '200':
        description: SSE stream (text/event-stream)
        content:
          text/event-stream:
            schema:
              $ref: '../schemas/ai.yaml#/ChatSseEvent'

/conversations/{id}/runs/{runId}/cancel:
  post:
    summary: Ask a run to stop
    operationId: cancelAgentRun
    tags: [AI]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '202':
        description: Cancellation requested
        content:
          application/json:
            schema:
              type: object
              required: [runId]
              properties:
                runId:
                  type: string
                  format: uuid
