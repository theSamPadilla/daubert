/blockchain/fetch-history:
  post:
    summary: Fetch wallet transaction history
    operationId: fetchHistory
    tags:
      - Blockchain
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/blockchain.yaml#/FetchHistoryRequest'
    responses:
      '200':
        description: Transaction history
        content:
          application/json:
            schema:
              $ref: '../schemas/blockchain.yaml#/FetchHistoryResponse'
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

/blockchain/get-transaction:
  post:
    summary: Fetch details for a single transaction
    operationId: getTransaction
    tags:
      - Blockchain
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/blockchain.yaml#/GetTransactionRequest'
    responses:
      '200':
        description: Transaction detail
        content:
          application/json:
            schema:
              $ref: '../schemas/blockchain.yaml#/TransactionDetailResult'
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

/blockchain/get-address-info:
  post:
    summary: Fetch info for a single address
    operationId: getAddressInfo
    tags:
