/cases:
  get:
    summary: List all cases
    operationId: listCases
    responses:
      '200':
        description: Array of cases
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/cases.yaml#/Case'
  post:
    summary: Create a case
    operationId: createCase
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/cases.yaml#/CreateCaseRequest'
    responses:
      '201':
        description: Created case
        content:
          application/json:
            schema:
              $ref: '../schemas/cases.yaml#/Case'

/cases/{id}:
  get:
    summary: Get a case with investigation summaries
    operationId: getCase
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Case with investigations
        content:
          application/json:
            schema:
              $ref: '../schemas/cases.yaml#/Case'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
  patch:
    summary: Update a case
    operationId: updateCase
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/cases.yaml#/UpdateCaseRequest'
    responses:
      '200':
        description: Updated case
        content:
          application/json:
            schema:
              $ref: '../schemas/cases.yaml#/Case'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
  delete:
    summary: Delete a case
    operationId: deleteCase
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Deleted
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

/cases/{caseId}/members:
  get:
    summary: List members of a case
    operationId: listCaseMembers
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Case members
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/admin.yaml#/CaseMember'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
  post:
    summary: Add an existing platform user to this case
    operationId: addCaseMember
    tags: [cases]
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/cases.yaml#/AddCaseMemberRequest'
    responses:
      '200':
        description: Membership created
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/CaseMember'
      '404':
        description: No user with that email
      '409':
        description: User is already a member

/cases/{caseId}/members/{userId}:
  patch:
    summary: Change a member's role
    operationId: updateCaseMemberRole
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/admin.yaml#/UpdateMemberRoleRequest'
    responses:
      '200':
        description: Updated membership
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/CaseMember'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
  delete:
    summary: Remove a member from a case
    operationId: removeCaseMember
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Removed
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

/cases/{caseId}/members/me/leave:
  post:
    summary: Leave a case (self-leave)
    operationId: leaveCaseMembership
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Left
      '409':
        description: Cannot leave — you are the sole owner
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
