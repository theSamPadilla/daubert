/cases/{caseId}/data-room/files:
  get:
    summary: List files in the data room for a case
    operationId: dataRoomListFiles
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Files in the data room
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/data-room.yaml#/DataRoomFile'
  post:
    summary: Upload a file to the data room (multipart)
    description: |
      Streaming multipart upload. The body is parsed by busboy and piped
      directly into storage — peak memory is ~256KB regardless of file size.
      50MB cap, single file per request.
    operationId: dataRoomUpload
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: folderId
        in: query
        required: false
        schema:
          type: string
          nullable: true
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
    responses:
      '200':
        description: Created file metadata
        content:
          application/json:
            schema:
              $ref: '../schemas/data-room.yaml#/DataRoomFile'

/cases/{caseId}/data-room/files/{fileId}/download:
  get:
    summary: Stream a file download
    description: |
      Streams the file with Content-Type, Content-Disposition, and
      Content-Length headers.
    operationId: dataRoomDownload
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fileId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: File contents
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary

/cases/{caseId}/data-room/files/{fileId}:
  delete:
    summary: Delete a file from the data room
    operationId: dataRoomDeleteFile
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fileId
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: No Content

/cases/{caseId}/data-room/import/google-drive:
  post:
    summary: Import files from Google Drive into the data room
    operationId: dataRoomImportFromGoogleDrive
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/data-room.yaml#/ImportFromDriveRequest'
    responses:
      '200':
        description: Import results
        content:
          application/json:
            schema:
              $ref: '../schemas/data-room.yaml#/ImportFromDriveResponse'
      '400':
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Case not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

/cases/{caseId}/data-room/contents:
  get:
    summary: Get data room contents for a folder (or root)
    operationId: dataRoomGetContents
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: folderId
        in: query
        required: false
        schema:
          type: string
          nullable: true
    responses:
      '200':
        description: Contents of the requested folder
        content:
          application/json:
            schema:
              $ref: '../schemas/data-room.yaml#/DataRoomContents'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Case or folder not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

