/orgs/{org}/declarants:
  get:
    summary: List declarants for an organization
    operationId: listDeclarants
    parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
        description: Organization slug
    responses:
      '200':
        description: Declarants
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/declarants.yaml#/Declarant'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
  post:
    summary: Create a declarant
    operationId: createDeclarant
    parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
        description: Organization slug
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/declarants.yaml#/CreateDeclarantRequest'
    responses:
      '201':
        description: Created declarant
        content:
          application/json:
            schema:
              $ref: '../schemas/declarants.yaml#/Declarant'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

/orgs/{org}/declarants/{declarantId}:
  patch:
    summary: Update a declarant
    operationId: updateDeclarant
    parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
        description: Organization slug
      - name: declarantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/declarants.yaml#/UpdateDeclarantRequest'
    responses:
      '200':
        description: Updated declarant
        content:
          application/json:
            schema:
              $ref: '../schemas/declarants.yaml#/Declarant'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
  delete:
    summary: Delete a declarant
    operationId: deleteDeclarant
    parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
        description: Organization slug
      - name: declarantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Deleted
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
