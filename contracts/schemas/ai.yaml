Conversation:
  type: object
  required: [id, caseId, userId, createdAt, updatedAt, oldestMessageAt, contextTokens, seedSummary, continuedFromConversationId, continuedFromTitle, historyTruncatedAt]
  properties:
    id:
      type: string
      format: uuid
    caseId:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    title:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    oldestMessageAt:
      type: string
      format: date-time
      nullable: true
      description: Timestamp of the oldest retained message, or null if the conversation has none (always null on create)
    contextTokens:
      type: integer
      description: Estimated size of the conversation's context in tokens, as of the latest run
    seedSummary:
      type: string
      nullable: true
      description: Summary of the source conversation this one was seeded with, or null if not a continuation
    continuedFromConversationId:
      type: string
      format: uuid
      nullable: true
      description: The conversation this one continues, or null if not a continuation
    historyTruncatedAt:
      type: string
      format: date-time
      nullable: true
      description: When retention last purged messages from this conversation, or null if its history is complete
    continuedFromTitle:
      type: string
      nullable: true
      description: Title of the source conversation, or null if not a continuation

Message:
  type: object
  required: [id, conversationId, role, content, createdAt]
  properties:
    id:
      type: string
      format: uuid
    conversationId:
      type: string
      format: uuid
    role:
      type: string
      enum: [user, assistant]
    content:
      type: array
      items:
        type: object
    createdAt:
      type: string
      format: date-time

ChatRequest:
  type: object
  properties:
    message:
      type: string
      minLength: 1
    caseId:
      type: string
      format: uuid
    investigationId:
      type: string
      format: uuid
    model:
      type: string
    attachments:
      type: array
      items:
        type: object
        required: [name, mediaType, data]
        properties:
          name:
            type: string
          mediaType:
            type: string
          data:
            type: string
            description: Base64-encoded file content

AgentRun:
  type: object
  required: [id, status, userMessageId, error, createdAt, finishedAt]
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, timed_out, interrupted]
    userMessageId:
      type: string
      format: uuid
      nullable: true
    error:
      type: object
      nullable: true
      required: [errorId, message]
      properties:
        errorId:
          type: string
        message:
          type: string
        code:
          type: string
          enum: [context_overflow, service_unavailable, unknown]
          description: Classification of the failure
    createdAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
      nullable: true

AgentRunStarted:
  type: object
  required: [runId, status]
  properties:
    runId:
      type: string
      format: uuid
    status:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, timed_out, interrupted]

LatestAgentRun:
  type: object
  required: [run]
  properties:
    run:
      allOf:
        - $ref: '../schemas/ai.yaml#/AgentRun'
      nullable: true

# SSE stream — documents the event types emitted on the chat endpoint.
# Actual response is text/event-stream, not JSON.
ChatSseEvent:
  type: object
  properties:
    type:
      type: string
      enum: [text_delta, tool_start, tool_done, graph_updated, production_updated, context_usage, done, error]
    data:
      type: object
      description: >-
        Event payload. `context_usage` data is `{ tokens: integer }` (current
        context size in tokens). `error` data is `{ errorId, message, code? }`
        where `code` is one of `context_overflow`, `service_unavailable`,
        `unknown`.
      properties:
        tokens:
          type: integer
          description: context_usage events only
        code:
          type: string
          enum: [context_overflow, service_unavailable, unknown]
          description: error events only
