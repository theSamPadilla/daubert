Conversation:
  type: object
  required: [id, caseId, userId, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    caseId:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    title:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Message:
  type: object
  required: [id, conversationId, role, content, createdAt]
  properties:
    id:
      type: string
      format: uuid
    conversationId:
      type: string
      format: uuid
    role:
      type: string
      enum: [user, assistant]
    content:
      type: array
      items:
        type: object
    createdAt:
      type: string
      format: date-time

ChatRequest:
  type: object
  properties:
    message:
      type: string
      minLength: 1
    caseId:
      type: string
      format: uuid
    investigationId:
      type: string
      format: uuid
    model:
      type: string
    attachments:
      type: array
      items:
        type: object
        required: [name, mediaType, data]
        properties:
          name:
            type: string
          mediaType:
            type: string
          data:
            type: string
            description: Base64-encoded file content

AgentRun:
  type: object
  required: [id, status, userMessageId, error, createdAt, finishedAt]
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, timed_out, interrupted]
    userMessageId:
      type: string
      format: uuid
      nullable: true
    error:
      type: object
      nullable: true
      required: [errorId, message]
      properties:
        errorId:
          type: string
        message:
          type: string
    createdAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
      nullable: true

AgentRunStarted:
  type: object
  required: [runId, status]
  properties:
    runId:
      type: string
      format: uuid
    status:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, timed_out, interrupted]

LatestAgentRun:
  type: object
  required: [run]
  properties:
    run:
      allOf:
        - $ref: '../schemas/ai.yaml#/AgentRun'
      nullable: true

# SSE stream — documents the event types emitted on the chat endpoint.
# Actual response is text/event-stream, not JSON.
ChatSseEvent:
  type: object
  properties:
    type:
      type: string
      enum: [text_delta, tool_start, tool_done, graph_updated, production_updated, done, error]
    data:
      type: object
