Case:
  type: object
  required: [id, name, orgId, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    orgId:
      type: string
      format: uuid
    summary:
      type: string
      nullable: true
      description: Free-form description of the matter under investigation.
    role:
      $ref: '../schemas/cases.yaml#/CaseRole'
      description: The caller's role in this case. Present when the case is fetched in user context.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    investigations:
      type: array
      items:
        $ref: '../schemas/investigations.yaml#/InvestigationSummary'

CaseRole:
  type: string
  enum:
    - owner
    - editor
    - viewer

InvestigationSummary:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string

CreateCaseRequest:
  type: object
  required: [name, orgId]
  properties:
    name:
      type: string
    orgId:
      type: string
      format: uuid
    summary:
      type: string

UpdateCaseRequest:
  type: object
  properties:
    name:
      type: string
    summary:
      type: string
      nullable: true

CaseMember:
  type: object
  required: [id, userId, caseId, role, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    caseId:
      type: string
      format: uuid
    role:
      $ref: '#/CaseRole'
    user:
      type: object
      required: [id, email, name, linked, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        linked:
          type: boolean
          description: True once the user has signed in to Firebase and the UID has been bound to this row.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AddCaseMemberRequest:
  type: object
  required: [email, role]
  properties:
    email:
      type: string
      format: email
    role:
      $ref: '#/CaseRole'

UpdateCaseMemberRoleRequest:
  type: object
  required: [role]
  properties:
    role:
      $ref: '#/CaseRole'
