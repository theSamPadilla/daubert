Case:
  type: object
  required: [id, name, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    startDate:
      type: string
      format: date-time
      nullable: true
    role:
      $ref: '../schemas/admin.yaml#/CaseRole'
      description: The caller's role in this case. Present when the case is fetched in user context.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    investigations:
      type: array
      items:
        $ref: '../schemas/investigations.yaml#/InvestigationSummary'

InvestigationSummary:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string

CreateCaseRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
    startDate:
      type: string
      format: date-time

UpdateCaseRequest:
  type: object
  properties:
    name:
      type: string
    startDate:
      type: string
      format: date-time
      nullable: true

AddCaseMemberRequest:
  type: object
  required: [email, role]
  properties:
    email:
      type: string
      format: email
    role:
      $ref: '../schemas/admin.yaml#/CaseRole'
