DataRoomFile:
  type: object
  required: [id, name, mimeType, size, uploadedByUserId, createdAt]
  properties:
    id:
      type: string
    name:
      type: string
    mimeType:
      type: string
    size:
      type: string
    uploadedByUserId:
      type: string
    createdAt:
      type: string
      format: date-time

ImportFromDriveRequest:
  type: object
  required: [accessToken, fileIds]
  properties:
    accessToken:
      type: string
    fileIds:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 25

ImportFromDriveResponse:
  type: object
  required: [imported, failed]
  properties:
    imported:
      type: array
      items:
        $ref: './data-room.yaml#/DataRoomFile'
    failed:
      type: array
      items:
        type: object
        required: [fileId, error]
        properties:
          fileId:
            type: string
          error:
            type: string
