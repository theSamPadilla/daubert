DataRoomFile:
  type: object
  required: [id, name, mimeType, size, uploadedByUserId, createdAt]
  properties:
    id:
      type: string
    name:
      type: string
    mimeType:
      type: string
    size:
      type: string
    uploadedByUserId:
      type: string
    createdAt:
      type: string
      format: date-time
