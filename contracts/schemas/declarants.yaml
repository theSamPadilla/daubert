Declarant:
  type: object
  required: [id, organizationId, userId, displayName, title, firm, qualifications, cvExhibit, priorTestimony, hourlyRate, nonContingencyDisclosure, dateOfBirth, address, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
      nullable: true
      description: Optional link to a member account.
    displayName:
      type: string
    title:
      type: string
      nullable: true
    firm:
      type: string
      nullable: true
    qualifications:
      type: array
      items:
        $ref: './productions.yaml#/DeclarationParagraph'
    cvExhibit:
      type: string
      nullable: true
      description: Description or URL for the declarant's CV exhibit.
    priorTestimony:
      type: array
      items:
        type: string
    hourlyRate:
      type: string
      nullable: true
    nonContingencyDisclosure:
      type: string
      nullable: true
    dateOfBirth:
      type: string
      nullable: true
    address:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateDeclarantRequest:
  type: object
  required: [displayName]
  properties:
    userId:
      type: string
      format: uuid
    displayName:
      type: string
    title:
      type: string
    firm:
      type: string
    qualifications:
      type: array
      items:
        $ref: './productions.yaml#/DeclarationParagraph'
    cvExhibit:
      type: string
    priorTestimony:
      type: array
      items:
        type: string
    hourlyRate:
      type: string
    nonContingencyDisclosure:
      type: string
    dateOfBirth:
      type: string
    address:
      type: string

DeclarantFileKind:
  type: string
  enum: [cv, prior_declaration]

DeclarantFile:
  type: object
  required: [id, declarantId, kind, name, mimeType, size, uploadedByUserId, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    declarantId:
      type: string
      format: uuid
    kind:
      $ref: '#/DeclarantFileKind'
    name:
      type: string
    mimeType:
      type: string
    size:
      type: string
    uploadedByUserId:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

OrgFile:
  type: object
  required: [id, declarantId, declarantName, declarantUserId, kind, name, mimeType, size, uploadedByUserId, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    declarantId:
      type: string
      format: uuid
    declarantName:
      type: string
      description: Display name of the declarant this file is attached to.
    declarantUserId:
      type: string
      format: uuid
      nullable: true
      description: The member account linked to the declarant, if any.
    kind:
      $ref: '#/DeclarantFileKind'
    name:
      type: string
    mimeType:
      type: string
    size:
      type: string
    uploadedByUserId:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

