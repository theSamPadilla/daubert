  type: object
  properties:
    userId:
      type: string
      format: uuid
      nullable: true
    displayName:
      type: string
    title:
      type: string
      nullable: true
    firm:
      type: string
      nullable: true
    qualifications:
      type: array
      items:
        $ref: './productions.yaml#/DeclarationParagraph'
    cvExhibit:
      type: string
      nullable: true
    priorTestimony:
      type: array
      items:
        type: string
    hourlyRate:
      type: string
      nullable: true
    nonContingencyDisclosure:
      type: string
      nullable: true
    dateOfBirth:
      type: string
      nullable: true
    address:
      type: string
      nullable: true
