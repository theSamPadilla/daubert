OAuthConsentPreview:
  type: object
  required: [clientId, clientDisplayName, redirectUri, clientState, eligibleOrgs]
  properties:
    clientId:
      type: string
      description: The OAuth client identifier.
    clientDisplayName:
      type: string
      description: Human-readable name of the OAuth client shown on the consent screen.
    redirectUri:
      type: string
      format: uri
      description: The redirect URI the auth code will be sent to.
    clientState:
      type: string
      nullable: true
      description: The opaque state value the client sent in the original authorization request. Null if not provided.
    eligibleOrgs:
      type: array
      description: Organizations the authenticated user may consent on behalf of (role admin or member only; guests excluded).
      items:
        $ref: '#/EligibleOrgSummary'

EligibleOrgSummary:
  type: object
  required: [id, slug, name, role]
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    name:
      type: string
    role:
      type: string
      enum: [admin, member]
      description: The caller's role in this organization.

OAuthSessionSummary:
  type: object
  required: [id, organizationId, surfaceLabel, lastUsedAt, createdAt]
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    surfaceLabel:
      type: string
      description: Human-readable label for the connected surface (e.g. "Claude Desktop"). Set at consent time and may be augmented on first MCP initialize.
    lastUsedAt:
      type: string
      format: date-time
      nullable: true
      description: ISO timestamp of the last authenticated MCP call, or null if never used after connect.
    createdAt:
      type: string
      format: date-time

SurfaceInstructions:
  type: object
  required: [steps]
  properties:
    steps:
      type: array
      description: Ordered setup steps, rendered as a numbered list.
      items:
        type: string
    warning:
      type: string
      description: Optional prominent warning shown above the note (e.g. a costly default).
    note:
      type: string
      description: Optional caveat shown below the steps (e.g. Team/Enterprise plans).

StartConnectResponse:
  type: object
  required: [mcpUrl, perSurfaceInstructions]
  properties:
    mcpUrl:
      type: string
      format: uri
      description: The MCP server URL to paste into the OAuth client (e.g. Claude Desktop settings).
    perSurfaceInstructions:
      type: object
      required: [claudeApps, chatgpt, perplexity]
      description: Structured setup instructions per surface.
      properties:
        claudeApps:
          $ref: '#/SurfaceInstructions'
        chatgpt:
          $ref: '#/SurfaceInstructions'
        perplexity:
          $ref: '#/SurfaceInstructions'

AgentActionSummary:
  type: object
  required: [id, sessionId, agentLabel, organizationId, action, targetRef, status, createdAt]
  properties:
    id:
      type: string
      format: uuid
    sessionId:
      type: string
      format: uuid
      description: The OAuth session (agent connection) that performed the action.
    agentLabel:
      type: string
      description: Surface label of the session that performed the action ("Unknown agent" if the session row is gone).
    organizationId:
      type: string
      format: uuid
    action:
      type: string
      description: The mutation performed (e.g. create_investigation, import_transactions).
    targetRef:
      type: string
      nullable: true
      description: Reference to the mutated resource (e.g. "case:<id>", "trace:<id>").
    status:
      type: string
      enum: [ok, error]
      description: Whether the action succeeded or was denied/failed.
    createdAt:
      type: string
      format: date-time
