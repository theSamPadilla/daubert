ProductionType:
  type: string
  enum:
    - report
    - chart
    - chronology
    - declaration
    - redline

Production:
  type: object
  required: [id, name, type, data, caseId, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    type:
      $ref: '#/ProductionType'
    data:
      type: object
      additionalProperties: true
    caseId:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateProductionRequest:
  type: object
  required: [name, type, data]
  properties:
    name:
      type: string
    type:
      $ref: '#/ProductionType'
    data:
      type: object
      additionalProperties: true

UpdateProductionRequest:
  type: object
  properties:
    name:
      type: string
    type:
      $ref: '#/ProductionType'
    data:
      type: object
      additionalProperties: true

DeclarationFormatId:
  type: string
  enum:
    - ca-declaration
    - ny-affirmation
    - federal-1746
    - tx-declaration
    - fl-declaration

DeclarationVariant:
  type: string
  deprecated: true
  description: Deprecated alias for formatId; kept for back-compat with existing rows. Use formatId instead.
  enum:
    - ca-declaration
    - ny-affirmation

DeclarationCaption:
  type: object
  required: [attorneyBlock, court, county, plaintiff, defendant, caseNumber, documentTitle, hearingInfo]
  properties:
    attorneyBlock:
      type: string
      description: Multiline CA gutter block. Empty for NY.
    court:
      type: string
      description: '"SUPERIOR COURT OF THE STATE OF CALIFORNIA"'
    county:
      type: string
      description: '"COUNTY OF SAN FRANCISCO"'
    plaintiff:
      type: string
    defendant:
      type: string
    caseNumber:
      type: string
      description: '"Case No. CGC-24-620900" / "Index No.: 365181/2024"'
    documentTitle:
      type: string
      description: '"DECLARATION OF … IN SUPPORT OF …"'
    hearingInfo:
      type: string
      description: Multiline hearing/dept/action-filed/trial-date block. Optional content.

DeclarationSubItem:
  type: object
  required: [id, text]
  properties:
    id:
      type: string
    text:
      type: string

DeclarationFootnote:
  type: object
  required: [id, text]
  properties:
    id:
      type: string
    text:
      type: string

DeclarationParagraph:
  type: object
  required: [id, text, subItems, exhibitIds, footnotes]
  properties:
    id:
      type: string
    text:
      type: string
      description: Plain text; inline <b>/<i>/<u> allowed, nothing else.
    subItems:
      type: array
      items:
        $ref: '#/DeclarationSubItem'
    exhibitIds:
      type: array
      items:
        type: string
      description: Renders as "See Exhibit(s) <label(s)>" after the text.
    footnotes:
      type: array
      items:
        $ref: '#/DeclarationFootnote'

DeclarationSectionKind:
  type: string
  enum:
    - qualifications
    - assignment
    - summary_of_opinions
    - background
    - authentication
    - findings
    - conclusions
    - recommendations
    - custom

DeclarationSection:
  type: object
  required: [id, kind, heading, paragraphs]
  properties:
    id:
      type: string
    kind:
      $ref: '#/DeclarationSectionKind'
    heading:
      type: string
      description: '"EXPERT BACKGROUND" — letter ("A.") computed at render.'
    paragraphs:
      type: array
      items:
        $ref: '#/DeclarationParagraph'

DeclarationExhibitSource:
  type: object
  required: [kind]
  properties:
    kind:
      type: string
      enum:
        - transaction
        - url
        - file
        - other
    txHash:
      type: string
    chain:
      type: string
    url:
      type: string
    note:
      type: string

DeclarationExhibit:
  type: object
  required: [id, label, description, source]
  properties:
    id:
      type: string
    label:
      type: string
      description: '"A", "B1" — explicit, unique per declaration.'
    description:
      type: string
    source:
      nullable: true
      allOf:
        - $ref: '#/DeclarationExhibitSource'

DeclarationData:
  type: object
  required: [schemaVersion, caption, declarantName, sections, exhibits, execution]
  properties:
    schemaVersion:
      type: integer
      enum: [1]
    formatId:
      $ref: '#/DeclarationFormatId'
    variant:
      $ref: '#/DeclarationVariant'
      description: Deprecated alias for formatId; retained for existing rows. New writes should use formatId.
    caption:
      $ref: '#/DeclarationCaption'
    declarantName:
      type: string
    declarantDateOfBirth:
      type: string
      description: Declarant date of birth. Required only by formats that list it in requiredDeclarantFields (e.g. TX).
    declarantAddress:
      type: string
      description: Declarant address. Required only by formats that list it in requiredDeclarantFields (e.g. TX).
    sections:
      type: array
      items:
        $ref: '#/DeclarationSection'
    exhibits:
      type: array
      items:
        $ref: '#/DeclarationExhibit'
    execution:
      type: object
      required: [place, date, signatureName]
      properties:
        place:
          type: string
        date:
          type: string
        signatureName:
          type: string

RedlineSource:
  type: object
  required: [fileId, fileName, mimeType, kind, extractedAt]
  properties:
    fileId:
      type: string
      description: data_room_files.id at snapshot time.
    fileName:
      type: string
    mimeType:
      type: string
    kind:
      type: string
      enum:
        - docx
        - pdf
    extractedAt:
      type: string
      format: date-time

RedlineAnchor:
  type: object
  required: [text, start, end]
  properties:
    text:
      type: string
      description: The verbatim quoted span as matched in baseText (raw, not normalized).
    start:
      type: integer
      description: Raw char offset into baseText, inclusive.
    end:
      type: integer
      description: Raw char offset into baseText, exclusive.

RedlineEdit:
  type: object
  required: [id, kind, anchor, newText, basis, status, origin]
  properties:
    id:
      type: string
      description: Server-generated UUID.
    kind:
      type: string
      enum:
        - replace
        - delete
        - insert_after
    anchor:
      $ref: '#/RedlineAnchor'
    newText:
      type: string
      description: Empty string for kind "delete".
    basis:
      type: string
      description: The forensic justification.
    comment:
      type: string
      description: Optional extra drafting note.
    status:
      type: string
      enum:
        - proposed
        - accepted
        - rejected
      description: Always 'proposed' on creation.
    origin:
      type: string
      enum:
        - agent
        - user

RedlineComment:
  type: object
  required: [id, title, text]
  description: Document-level cover note.
  properties:
    id:
      type: string
    title:
      type: string
    text:
      type: string

RedlineData:
  type: object
  required: [schemaVersion, source, baseText, edits, comments]
  properties:
    schemaVersion:
      type: integer
      enum: [1]
    source:
      $ref: '#/RedlineSource'
    baseText:
      type: string
      description: Immutable snapshot; paragraphs separated by '\n\n'.
    edits:
      type: array
      items:
        $ref: '#/RedlineEdit'
    comments:
      type: array
      items:
        $ref: '#/RedlineComment'
